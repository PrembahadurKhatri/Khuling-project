<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Khilung Kalika Construction Pvt. Ltd.</title>
    <meta name="description" content="Premium construction, infrastructure, and engineering services." />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Playfair+Display:ital,wght@0,500;0,600;0,700;0,800;1,500&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

    <style>
      /* ===== Preloader ===== */
      #preloader {
        position: fixed;
        inset: 0;
        background: linear-gradient(135deg, #0b1f3a 0%, #102a4c 50%, #0a192f 100%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 99999;
        transition: opacity 0.6s ease, visibility 0.6s ease;
      }
      #preloader.loader-hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      #loader-logo {
        width: clamp(96px, 16vw, 140px);
        height: auto;
        filter: drop-shadow(0 8px 24px rgba(0, 0, 0, 0.35));
        animation: loaderLogoIn 0.6s cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      @keyframes loaderLogoIn {
        0% {
          opacity: 0;
          transform: scale(0.8);
        }
        100% {
          opacity: 1;
          transform: scale(1);
        }
      }

      /* Loading bar, directly under the logo */
      #loader-bar-track {
        margin-top: 32px;
        width: min(70vw, 320px);
        height: 6px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.12);
        overflow: hidden;
        box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.3);
      }
      #loader-bar-fill {
        height: 100%;
        width: 0%;
        border-radius: 999px;
        background: linear-gradient(90deg, #b8860b, #ffd700, #b8860b);
        background-size: 200% 100%;
        box-shadow: 0 0 12px rgba(255, 215, 0, 0.7);
        transition: width 1s cubic-bezier(0.4, 0, 0.2, 1);
        animation: loaderBarShine 1.2s linear infinite;
      }
      @keyframes loaderBarShine {
        0% {
          background-position: 200% 0;
        }
        100% {
          background-position: -200% 0;
        }
      }
    </style>
  </head>
  <body>
    <!-- ===== Preloader (sits outside #root so React never touches it) ===== -->
    <div id="preloader">
      <img id="loader-logo" src="/logo.png" alt="Khilung Kalika Construction" />

      <div id="loader-bar-track">
        <div id="loader-bar-fill"></div>
      </div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <script>
      (function () {
        var DURATION = 1000; // bar fills left-to-right in exactly 1s
        var barEl = document.getElementById("loader-bar-fill");
        var loader = document.getElementById("preloader");

        function finishLoading() {
          setTimeout(function () {
            loader.classList.add("loader-hidden");
            setTimeout(function () {
              loader.remove();
            }, 600);
          }, 150); // brief hold at 100% before fading out and opening the site
        }

        window.addEventListener("load", function () {
          // Two rAFs so the browser commits the 0% width first — otherwise
          // the transition from 0% to 100% can get collapsed into one frame.
          requestAnimationFrame(function () {
            requestAnimationFrame(function () {
              barEl.style.width = "100%";
            });
          });
          setTimeout(finishLoading, DURATION);
        });
      })();
    </script>
  </body>
</html>
