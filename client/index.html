<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Khilung Kalika Construction Pvt. Ltd.</title>
    <meta name="description" content="Premium construction, infrastructure, and engineering services." />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Playfair+Display:ital,wght@0,500;0,600;0,700;0,800;1,500&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

    <style>
      /* ===== Preloader ===== */
      #preloader {
        position: fixed;
        inset: 0;
        background: linear-gradient(135deg, #0b1f3a 0%, #102a4c 50%, #0a192f 100%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 99999;
        transition: opacity 0.6s ease, visibility 0.6s ease;
      }
      #preloader.loader-hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      /* Golden progress line across the very top of the page */
      #loader-topbar {
        position: fixed;
        top: 0;
        left: 0;
        height: 3px;
        width: 0%;
        background: linear-gradient(90deg, #b8860b, #ffd700, #b8860b);
        box-shadow: 0 0 8px rgba(255, 215, 0, 0.6);
        z-index: 100000;
        transition: width 0.1s linear;
      }

      /* Golden percentage readout above the main text */
      #loader-percent {
        font-family: "Poppins", sans-serif;
        font-weight: 500;
        font-size: clamp(0.95rem, 2.4vw, 1.3rem);
        letter-spacing: 0.25em;
        color: #ffd700;
        margin-bottom: 22px;
      }
      #loader-percent::after {
        content: "%";
      }

      .loader-text-wrap {
        position: relative;
        font-family: "Playfair Display", serif;
        font-weight: 700;
        font-size: clamp(1.6rem, 5vw, 3.2rem);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        text-align: center;
        line-height: 1.3;
        white-space: nowrap;
      }

      /* Outline-only base layer */
      .loader-text-outline {
        color: transparent;
        -webkit-text-stroke: 1.5px #ffffff;
        text-stroke: 1.5px #ffffff;
      }

      /* Solid white fill layer, revealed bottom-to-top like pouring liquid */
      .loader-text-fill {
        position: absolute;
        top: 0;
        left: 0;
        color: #ffffff;
        -webkit-text-stroke: 1.5px #ffffff;
        text-stroke: 1.5px #ffffff;
        clip-path: inset(100% 0 0 0);
        animation: pourFill 2.4s cubic-bezier(0.65, 0, 0.35, 1) forwards;
        animation-delay: 0.2s;
      }

      @keyframes pourFill {
        0% {
          clip-path: inset(100% 0 0 0);
        }
        100% {
          clip-path: inset(0% 0 0 0);
        }
      }
    </style>
  </head>
  <body>
    <!-- ===== Preloader (sits outside #root so React never touches it) ===== -->
    <div id="preloader">
      <div id="loader-topbar"></div>

      <div id="loader-percent">0</div>

      <div class="loader-text-wrap">
        <span class="loader-text-outline">Khilung Kalika<br />Construction</span>
        <span class="loader-text-fill" aria-hidden="true">Khilung Kalika<br />Construction</span>
      </div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <script>
      (function () {
        var DURATION = 2600; // total loader duration in ms — matches the text pour timing
        var percentEl = document.getElementById("loader-percent");
        var topbarEl = document.getElementById("loader-topbar");
        var loader = document.getElementById("preloader");
        var start = null;

        function tick(timestamp) {
          if (!start) start = timestamp;
          var elapsed = timestamp - start;
          var progress = Math.min(elapsed / DURATION, 1);
          var percent = Math.round(progress * 100);

          percentEl.textContent = percent;
          topbarEl.style.width = percent + "%";

          if (progress < 1) {
            requestAnimationFrame(tick);
          } else {
            finishLoading();
          }
        }

        function finishLoading() {
          setTimeout(function () {
            loader.classList.add("loader-hidden");
            setTimeout(function () {
              loader.remove();
            }, 600);
          }, 200); // brief hold at 100% before fading out
        }

        window.addEventListener("load", function () {
          requestAnimationFrame(tick);
        });
      })();
    </script>
  </body>
</html>
